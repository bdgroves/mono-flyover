name: Prep render data

# Fetches the base terrain and imagery (8 m DEM, 5 m NAIP, the 60 m horizon
# DEM and a Sentinel-2 scene) and publishes them on the single-commit
# `prep-data` branch, kept off main so the repo stays small.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q rasterio numpy scipy pystac-client planetary-computer
      - run: python tools/prep_data.py 2>&1 | tee prep.log
      - name: Publish to prep-data branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prep && cp prep.log prep/ && cd prep
          git init -q -b prep-data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "prep data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prep-data
